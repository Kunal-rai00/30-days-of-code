<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex Layout</title>
    <style>
        .container {
            display: flex;
            width: 1200px;
            margin: 0 auto;
        }
        .left {
            flex-grow: 1;
            background-color: red;
        }
        .right{
            flex-grow: 2;
            background-color: yellow;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <h1>Left</h1>
        </div>
        <div class="right">
            <h1>Right</h1>
        </div>
    </div>
</body>
</html>
