<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vertical Alignmnet</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            width: 1200px;
            background-color: yellow;
        }

        .content {
            display: flex;
            height: 500px;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>Hello World</h1>
        </div>
    </div>
</body>
</html>
